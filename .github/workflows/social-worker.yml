# The Facebook manager's free worker: renders Reels with FFmpeg and publishes approved posts that are due.
# It does nothing until the repository variable SOCIAL_MANAGER is "on" and the secrets below exist.
# Nothing is ever published without the owner's approval in /admin/social; that rule lives in the database.
name: social-worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "default | daily | discover | draft | render | publish | reconcile | engagement | comments | connection | report"
        default: default

permissions:
  contents: read

concurrency:
  group: social-worker
  cancel-in-progress: false

jobs:
  run:
    if: vars.SOCIAL_MANAGER == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOCIAL_MANAGER: "on"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      SOCIAL_PUBLIC_ORIGIN: ${{ vars.SOCIAL_PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
      - run: pnpm install --frozen-lockfile
      - run: pnpm social:worker ${{ github.event.inputs.command || 'default' }}
