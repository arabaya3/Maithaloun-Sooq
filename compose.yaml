services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: maithalun_dev
      POSTGRES_USER: maithalun_dev
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:?Set POSTGRES_DEV_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - maithalun_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres-test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: maithalun_test
      POSTGRES_USER: maithalun_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"

volumes:
  maithalun_postgres_dev:
