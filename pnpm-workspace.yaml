packages:
  - "."

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Security pins. exceljs 4.4.0 (latest) ranges uuid ^8 but only calls require("uuid").v4, kept in uuid 11 (GHSA-w5hq-g745-h8pq).
# zod below 4.6.6: GHSA-mrhx-c7xc-m3w5. undici below 7.30.1: GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm.
# @serwist/utils 9.5.12 pins browserslist 4.28.6 (GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g); 4.29.3 is a compatible 4.x patch.
overrides:
  exceljs>uuid: 11.1.1
  browserslist: 4.29.3
  source-map-js: 1.2.2
  zod@4.4.3: 4.6.6
  undici@7.30.0: 7.30.1
